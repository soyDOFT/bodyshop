<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Exclusive Body Shop">
  <defs>
    <linearGradient id="ebs-steel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4f8fb" />
      <stop offset="0.5" stop-color="#c6d3e0" />
      <stop offset="1" stop-color="#8ca0b6" />
    </linearGradient>
    <!-- Inset from the shield outline so the car tucks inside the steel rim
         instead of spilling over it. -->
    <clipPath id="ebs-inner">
      <path d="M32 5.6 54 13.3v16.8c0 12.4-9 21.7-22 28-13-6.3-22-15.6-22-28V13.3z" />
    </clipPath>
  </defs>

  <!-- Shield: navy body, steel rim, echoing the source artwork. -->
  <path
    d="M32 2.5 57 11.2v18.9c0 13.9-10.2 24.4-25 31.4C17.2 54.5 7 44 7 30.1V11.2z"
    fill="#16304f"
  />
  <path
    d="M32 2.5 57 11.2v18.9c0 13.9-10.2 24.4-25 31.4C17.2 54.5 7 44 7 30.1V11.2z"
    fill="none"
    stroke="url(#ebs-steel)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <g clip-path="url(#ebs-inner)">
    <!-- Low, raked coupe. One solid silhouette, so it holds together at favicon size. -->
    <path
      d="M13.6 41.4c0-2.4 1.5-3.9 4.4-4.6l6.8-5.3c2-1.5 4.1-2.3 6.7-2.3h4.6c3.2 0 5.8.9 8.2 2.8l4.5 3.6c3.1.7 4.6 2.2 4.6 4.6v1.8c0 .9-.7 1.6-1.6 1.6H15.2c-.9 0-1.6-.7-1.6-1.6z"
      fill="url(#ebs-steel)"
    />
    <!-- Glasshouse, cut back to navy so it reads as a car rather than a blob. -->
    <path d="M29.9 30.9h-2.8c-1.9 0-3.4.5-5 1.6l-4.2 3.3h12z" fill="#16304f" />
    <path d="M32.5 30.9h2.6c2.5 0 4.4.7 6.2 2.1l3.4 2.8h-12.2z" fill="#16304f" />

    <!-- Speed swooshes, in place of the original's ribbon flourishes. -->
    <path d="M8 34.4h7l-2 2.1H8z" fill="url(#ebs-steel)" opacity="0.7" />
    <path d="M8 38.5h4.6l-1.4 2.1H8z" fill="url(#ebs-steel)" opacity="0.4" />

    <!-- Wheels -->
    <circle cx="22" cy="43.2" r="4.8" fill="#16304f" />
    <circle cx="22" cy="43.2" r="3" fill="url(#ebs-steel)" />
    <circle cx="42.6" cy="43.2" r="4.8" fill="#16304f" />
    <circle cx="42.6" cy="43.2" r="3" fill="url(#ebs-steel)" />

    <!-- Star, as in the source mark. -->
    <path d="M46.2 13.6l1.2 2.6 2.6 1.2-2.6 1.2-1.2 2.6-1.2-2.6-2.6-1.2 2.6-1.2z" fill="url(#ebs-steel)" />
  </g>
</svg>
